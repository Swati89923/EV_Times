spring.application.name=evtime-backend

# ---------------------------------------------------------------
# Database
# ---------------------------------------------------------------

spring.datasource.url=jdbc:mysql://localhost:3306/evtimesdb
spring.datasource.username=root
spring.datasource.password=swati1803

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------------------------------------------------------------
# News ingestion (NewsAPI.org)
# ---------------------------------------------------------------

news.api.key=e4dcc7c5352f4e70a65b343d7bbeab5a
news.fetch.enabled=true

# Every hour, on the hour
news.fetch.cron=0 0 * * * *

# ---------------------------------------------------------------
# JWT
# ---------------------------------------------------------------

jwt.secret=local-dev-only-secret-change-me-1234567890
jwt.expiration-ms=3600000

# ---------------------------------------------------------------
# CORS
# ---------------------------------------------------------------

cors.allowed-origins=http://localhost:5173

# ---------------------------------------------------------------
# Spring AI - Ollama
# ---------------------------------------------------------------

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:0.5b

# ---------------------------------------------------------------
# Redis
# ---------------------------------------------------------------

spring.data.redis.host=localhost
spring.data.redis.port=6379

# ---------------------------------------------------------------
# Logging
# ---------------------------------------------------------------

logging.level.root=INFO
logging.level.com.swati.evtimebackend=INFO
logging.level.org.springframework.security=WARN