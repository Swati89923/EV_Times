server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets (Vite output) can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing (React Router): any path that isn't a real file
    # falls back to index.html instead of a raw nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML shell itself, so a new deploy is picked up
    # immediately instead of serving a stale index.html referencing
    # assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
