<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Fonts: Space Grotesk (display/UI), Source Serif 4 (article body), IBM Plex Mono (data/readouts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="description" content="EV Times — electric vehicle news, battery technology, charging infrastructure and market intelligence." />

  <title>EV Times — Electric Vehicle News &amp; Intelligence</title>

  <!-- Set theme before first paint to avoid a flash of the wrong theme -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("ev_theme");
        var theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
